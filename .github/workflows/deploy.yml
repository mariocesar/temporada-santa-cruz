# CI + GitHub Pages deployment (PROJECT.md §80–81, single workflow to avoid
# duplication): every push to main and every pull request runs the full
# validation ladder (check → test → data:validate → build); only pushes to
# main (and manual dispatches) deploy the result to Pages.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Deploys to main serialize (never cancel a production deploy); PR runs get
# their own group per ref and cancel superseded builds.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run check

      - name: Test
        run: bun run test

      - name: Validate data
        run: bun run data:validate

      - name: Build
        run: bun run build
        env:
          # Project Pages base path (see vite.config.ts). A future custom
          # domain sets this to "/" instead.
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          # Deliberate acknowledgment (PROJECT.md §79): the dataset is still
          # the marked demo seed, so the deployed site shows the
          # DATOS DE DEMOSTRACIÓN banner. Remove once real data lands.
          ALLOW_DEMO_DATA: "true"

      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
