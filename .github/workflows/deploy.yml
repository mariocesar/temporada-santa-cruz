# Minimal Pages deployment — enough to see progress on every push to main.
# Phase 4 (docs/PLAN.md) completes this: add `bun run test` and
# `bun run data:validate` once those commands exist, plus PR validation.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run check

      - name: Build
        run: bun run build
        env:
          # Project Pages base path (see vite.config.ts). A future custom
          # domain sets this to "/" instead.
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          # Deliberate acknowledgment (PROJECT.md §79): the dataset is still
          # the marked demo seed, so the deployed site shows the
          # DATOS DE DEMOSTRACIÓN banner. Remove once real data lands.
          ALLOW_DEMO_DATA: "true"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
